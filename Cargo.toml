# canonical-keysort-json: deterministic Canonical JSON key-ordering at the
# serialization boundary. Single-crate library, the leaf dependency of
# attest-ledger and action-gate.
#
# Extracted (relicensed Apache-2.0 by the sole copyright holder) from the
# Open Agentic Platform's crates/canonical-json. See NOTICE.
#
# Governed by this repo's OWN specs/ corpus, compiled by the pinned spec-spine
# library (the dogfooding pattern spec-spine, tenant-emit, and tenant-tail
# all follow).
#
# Named `canonical-keysort-json` because the plain `canonical-json` (and its
# normalized twin `canonical_json`) is taken on crates.io by Mozilla's
# canonicaljson-rs, which implements gibson042's Canonical JSON spec (escapes
# non-ASCII to \uXXXX, normalizes floats) and is byte-incompatible with this
# minimal key-sort. `keysort` is the honest signal: this sorts keys, it does
# not do full canonical JSON. Import path is `canonical_keysort_json`.

[package]
name = "canonical-keysort-json"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/canonical-keysort-json"
homepage = "https://github.com/statecrafting/canonical-keysort-json"
description = "Deterministic Canonical JSON: recursive lexicographic sort of object keys at the serialization boundary, so values serialize byte-identically regardless of serde_json preserve_order."
authors = ["The canonical-keysort-json Authors"]
keywords = ["json", "canonical", "deterministic", "serialization", "hashing"]
categories = ["encoding", "data-structures"]
readme = "README.md"
# Ship only the essentials in the published tarball, not the repo governance
# (specs/, .github/, spec-spine.toml, standards/).
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[dependencies]
serde_json = "1"

# Root package is a workspace-of-one so the forbid-unsafe lint applies and
# spec-spine indexes this repo as a Cargo workspace.
[workspace]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[package.metadata.canonical-keysort-json]
spec = "000-canonical-keysort-json-bootstrap"
