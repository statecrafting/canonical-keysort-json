# spec-spine governing the canonical-keysort-json repository (dogfood).
#
# canonical-keysort-json vends a single-crate deterministic-JSON library; its
# own specs/ corpus is governed by the published spec-spine binary. This is the
# same dogfooding pattern spec-spine, OAP, tenant-emit, and tenant-tail all
# follow. spec-spine reads its config from `spec-spine.toml` at the repo root;
# only the metadata namespace and layout differ from the built-in defaults.
#
# The gate has one definition, the `gate` target in `Makefile` (the kit's file,
# installed by `spec-spine init --with-kit`), and both a local session and
# `.github/workflows/govern.yml` run it. There is no npm package here and no
# npx invocation: CI installs the binary via the published install.sh.

# The binary floor this repository is governed by. The harness calls verbs that
# do not exist below 0.18.0: `spec-spine check` is the composed freshness read
# the hooks, `Makefile`'s `gate` target and `govern.yml` all run, and
# `--fail-on-warn` reaches the compile half only through it. On an older binary
# those calls are usage errors, and a session would be told its shards are
# stale when the real fault is the tool.
#
# `>=` and not `= "0.18.0"`: a pin that forbids a newer binary would refuse
# every release after this one for no reason. `Config` derives
# `deny_unknown_fields`, so a binary predating spec 062 cannot deserialize this
# key at all and exits 3 with a config error rather than a misleading 2.
[meta]
required_version = "=0.28.0"

[manifest]
# The crate carries `[package.metadata.canonical-keysort-json].spec = "NNN-slug"`.
metadata_namespace = "canonical-keysort-json"

[domains]
allowed = []        # disabled: this repo's specs do not declare a `domain`

[kind]
allowed = []        # disabled: `kind` is free-text (symmetric with [domains])

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
cargo_workspace = "Cargo.toml"
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = []
standalone_npm_packages    = []

[index]
# Files folded into the global-inputs scalar, so a change to one stales every
# shard. The patterns are narrow on purpose. In the `glob` crate `dir/**`
# matches directories only and files need `dir/**/*`, which is how the previous
# `standards/**` and `.github/workflows/**` here matched zero files: the
# standards, the constitution, the contract and every workflow had never
# contributed to any content hash. A bare `.claude/**/*` would go wrong in the
# other direction, folding in `.DS_Store` and `settings.local.json` and making
# the shard hashes machine-dependent.
extra_hashed_inputs = ["scripts/statecraft/**/*", ".statecraft/AGENTS.md", ".statecraft/environment.json", ".statecraft/setup/github-actions-rust.json", ".github/CODEOWNERS", 
  "standards/**/*.md",
  ".github/workflows/*.yml",
  # Governance and harness files: an edit to what an agent may do should stale
  # the ledger the same way an edit to a spec does.
  "AGENTS.md",
  "CLAUDE.md",
  ".claude/rules/*.md",
  ".claude/settings.json",
  ".claude/agents/*.md",
  ".claude/skills/*/*.md",
  ".mcp.json",
  ".githooks/*.sh",
  "Makefile",
  # `.gitattributes` registers the merge driver on the shard globs, which is
  # behavior spec 001 sections 2 and 3 describe, so spec 001 claims the file.
  # A `file` unit carries no span and only span-backing files enter a shard
  # hash, so the claim alone left the contents invisible to the ledger and
  # `lint` refused it as L-008, exactly as it does for `src/lib.rs` below.
  # Listing it here folds it into the global-inputs scalar: an edit restamps
  # every shard, which is the right trade for a governance file that changes
  # about once a year and the wrong one for a tree of source.
  ".gitattributes",
  # The crate source itself. A `file` unit carries no span, and only
  # span-backing files enter a shard hash, so spec 000's claim on `src/lib.rs`
  # left its contents invisible to the ledger (L-008). That is not tolerable
  # here: spec 000 section 4 is the normative cross-language canonical form,
  # and an edit to the implementation of it must stale the index until the
  # corpus is recompiled and committed. spec-spine allowlists this case for
  # itself via `[lint] unwitnessed_allowed`; with one source file and one shard
  # there is no reason to take that debt.
  "src/**/*.rs",
]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build"]

[branding]
compiler_id = "spec-spine"
indexer_id  = "spec-spine"

[coupling]
bypass_prefixes = ["**/README.md"]
waiver_keyword = "Spec-Drift-Waiver:"

[frontmatter]
extra_known_keys = []
