# The governed-loop CI workflow every adopter wrote by hand (spec 064).
#
# Copy to .github/workflows/govern.yml. It runs the same `make gate` chain a
# session runs locally, so the gate has one definition rather than two that
# drift.
name: govern

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# LOCAL DEVIATION FROM THE KIT (the only one; keep it small so a kit update
# stays a copy rather than a merge).
#
# The kit ships two more jobs: a `probe` that publishes `has_cargo`/`has_npm`
# as job outputs, and a `build` job gated on it running `make build test fmt
# clippy`. Both are dropped here because `ci.yml` already runs the cargo stack
# gate with `--locked` on the same triggers, and keeping them would run every
# cargo command twice on every pull request. This workflow is the governance
# half only; `ci.yml` is the stack half.
#
# The finding the probe job exists to carry is preserved here so it is not
# rediscovered a fourth time: GitHub rejects `hashFiles` in a job-level `if`,
# because the expression is evaluated before the workspace exists and the
# function has no files to hash. Conditioning a job on "does this repository
# contain a Cargo.toml" therefore requires a probe job that checks out the code
# and publishes the answer as an output. If a `build` job is ever added back
# here, it needs that probe; `if: hashFiles('Cargo.toml') != ''` is the broken
# form.
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` because the coupling gate compares a base to a head,
      # and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install spec-spine
        run: |
          sh scripts/statecraft/install-spec-spine.sh
          echo "$PWD/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Read-only. `compile --check` and `index check` compare the committed
      # shards to the corpus without writing, so a stale tree is reported rather
      # than repaired: a gate that writes hides the defect it exists to find.
      - name: Governed loop
        run: make gate BASE=origin/${{ github.base_ref || 'main' }}
        if: github.event_name != 'pull_request'

      # The coupling gate needs a base and a head, so it runs on pull_request
      # only. The PR body goes to a file and reaches the gate through
      # `--pr-body`: a body containing a `Spec-Drift-Waiver:` line has no safe
      # shell quoting, and a file has no quoting at all.
      - name: Governed loop (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          sh scripts/statecraft/gate.sh governance
          .bin/spec-spine couple --base "origin/${{ github.base_ref }}" --head HEAD --pr-body "$RUNNER_TEMP/pr-body.txt"
